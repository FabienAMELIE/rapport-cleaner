name: Build RapportCleaner

on:
  push:
    tags:
      - 'V*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pdfplumber reportlab Pillow tkinterdnd2 pyinstaller

      - name: Build --onedir
        # V0.3.6.5 : passage de --onefile à --onedir
        # - Plus de _MEI temporaire → plus de conflit Defender au lancement/MAJ
        # - Le .exe seul est uploadé pour les MAJ (DLLs inchangées entre versions)
        # - La release contient : RapportCleaner.zip (première install) + RapportCleaner.exe (MAJ)
        # NOTE : mécanisme à valider en conditions réelles (V0.3.6.5 test)
        run: |
          pyinstaller --onedir --windowed `
            --collect-all tkinterdnd2 `
            --collect-all charset_normalizer `
            --hidden-import pdfplumber `
            --hidden-import reportlab `
            --hidden-import PIL `
            --hidden-import tkinter `
            --add-data "LS_LOGO_HOR_RGB_TRANSPARANT.png;." `
            --add-data "LS_LOGO_VERT_RGB_TRANSPARANT.png;." `
            --icon "LS_LOGO_ICON.ico" `
            --name RapportCleaner `
            rapport_cleaner.py

      - name: Zip the onedir folder (première installation)
        run: |
          Compress-Archive -Path dist\RapportCleaner\* -DestinationPath dist\RapportCleaner.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RapportCleaner-${{ github.ref_name }}
          path: |
            dist\RapportCleaner.zip
            dist\RapportCleaner\RapportCleaner.exe
